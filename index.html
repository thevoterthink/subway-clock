<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subway Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700;
  }
  body { display: flex; flex-direction: column; height: 100vh; }

  .top {
    height: 11vh; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 3vw; background: #1c1c1c; border-bottom: 0.4vh solid #333;
  }
  .station { font-size: 6.4vh; letter-spacing: -0.02em; }
  .clock { font-size: 6.4vh; font-variant-numeric: tabular-nums; }
  .clock .tz { font-size: 0.5em; color: #9b9b9b; margin-left: 0.35em; }

  .section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .label {
    height: 6vh; flex: none; display: flex; align-items: flex-end; padding: 0 3vw 0.8vh;
    font-size: 3.4vh; color: #9b9b9b; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .row {
    flex: 1; min-height: 0; display: flex; align-items: center; gap: 2.2vw;
    padding: 0 3vw; border-top: 0.25vh solid #262626;
  }
  .rank { width: 4.5vh; flex: none; font-size: 4.6vh; color: #b5b5b5; text-align: right; }
  .bullet {
    width: 8vh; height: 8vh; flex: none; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 5.6vh; line-height: 1; letter-spacing: -0.04em;
  }
  .bullet.express {
    width: 9.4vh; height: 9.4vh; margin: 0 -0.7vh; border-radius: 0; font-size: 5vh;
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  .bullet.long { font-size: 3.4vh; }
  .dest { flex: 1; min-width: 0; font-size: 6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mins { flex: none; font-size: 6.4vh; font-variant-numeric: tabular-nums; text-align: right; }
  .mins small { font-size: 0.62em; margin-left: 0.25em; }
  .empty { color: #6e6e6e; font-size: 4.4vh; }

  .foot {
    height: 4vh; flex: none; display: flex; align-items: center; justify-content: flex-end;
    padding: 0 3vw; font-size: 1.9vh; color: #5c5c5c; font-weight: 400;
  }
  body.idle, body.idle * { cursor: none; }

  .alert {
    flex: none; height: 12.5vh; display: none; align-items: center; gap: 2vw;
    padding: 0 3vw; background: #141414; border-bottom: 0.25vh solid #262626;
  }
  .alert.show { display: flex; }
  .alert .pill {
    flex: none; padding: 0.5vh 1.1vh; border-radius: 0.6vh; font-size: 2.3vh;
    text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
  }
  .alert .pill.live { background: #ffc233; color: #000; }
  .alert .pill.planned { border: 0.3vh solid #8a8a8a; color: #d0d0d0; }
  .alert .text {
    flex: 1; min-width: 0; font-size: 3.3vh; line-height: 1.3; font-weight: 400;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .alert .count { flex: none; font-size: 2.2vh; color: #6e6e6e; font-weight: 400; }
  .mini {
    display: inline-flex; align-items: center; justify-content: center; vertical-align: -0.12em;
    width: 1.15em; height: 1.15em; border-radius: 50%; font-size: 0.9em; font-weight: 700; line-height: 1;
  }
  .delayed {
    flex: none; font-size: 2.6vh; color: #ffc233; border: 0.25vh solid #ffc233;
    border-radius: 0.6vh; padding: 0.3vh 0.9vh; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .foot.warn { justify-content: center; background: #4a3300; color: #ffc233; font-weight: 700; font-size: 2.3vh; }
</style>
</head>

:"169 St","F03":"Parsons Blvd","F04":"Sutphin Blvd","F05":"Briarwood","F06":"Kew Gardens-Union Tpke","F07":"75 Av","F09":"Court Sq-23 St","F11":"Lexington Av/53 St","F12":"5 Av/53 St","F14":"2 Av","F15":"Delancey St-Essex St","F16":"East Broadway","F18":"York St","F20":"Bergen St","F21":"Carroll St","F22":"Smith-9 Sts","F23":"4 Av-9 St","F24":"7 Av","F25":"15 St-Prospect Park","F26":"Fort Hamilton Pkwy","F27":"Church Av","F29":"Ditmas Av","F30":"18 Av","F31":"Avenue I","F32":"Bay Pkwy","F33":"Avenue N","F34":"Avenue P","F35":"Kings Hwy","F36":"Avenue U","F38":"Avenue X","F39":"Neptune Av","G05":"Jamaica Center-Parsons/Archer","G06":"Sutphin Blvd-Archer Av-JFK Airport","G07":"Jamaica-Van Wyck","G08":"Forest Hills-71 Av","G09":"67 Av","G10":"63 Dr-Rego Park","G11":"Woodhaven Blvd","G12":"Grand Av-Newtown","G13":"Elmhurst Av","G14":"Jackson Hts-Roosevelt Av","G15":"65 St","G16":"Northern Blvd","G18":"46 St","G19":"Steinway St","G20":"36 St","G21":"Queens Plaza","G22":"Court Sq","G24":"21 St","G26":"Greenpoint Av","G28":"Nassau Av","G29":"Metropolitan Av","G30":"Broadway","G31":"Flushing Av","G32":"Myrtle-Willoughby Avs","G33":"Bedford-Nostrand Avs","G34":"Classon Av","G35":"Clinton-Washington Avs","G36":"Fulton St","H01":"Aqueduct Racetrack","H02":"Aqueduct-N Conduit Av","H03":"Howard Beach-JFK Airport","H04":"Broad Channel","H06":"Beach 67 St","H07":"Beach 60 St","H08":"Beach 44 St","H09":"Beach 36 St","H10":"Beach 25 St","H11":"Far Rockaway-Mott Av","H12":"Beach 90 St","H13":"Beach 98 St","H14":"Beach 105 St","H15":"Rockaway Park-Beach 116 St","J12":"121 St","J13":"111 St","J14":"104 St","J15":"Woodhaven Blvd","J16":"85 St-Forest Pkwy","J17":"75 St-Elderts Ln","J19":"Cypress Hills","J20":"Crescent St","J21":"Norwood Av","J22":"Cleveland St","J23":"Van Siclen Av","J24":"Alabama Av","J27":"Broadway Junction","J28":"Chauncey St","J29":"Halsey St","J30":"Gates Av","J31":"Kosciuszko St","L01":"8 Av","L02":"6 Av","L03":"14 St-Union Sq","L05":"3 Av","L06":"1 Av","L08":"Bedf   function displayRoute(id) {
    if (SHUTTLES.has(id)) return ["S", false];
    if (id === "SI" || id === "SIR") return ["SIR", false];
    if (id.length > 1 && id.endsWith("X")) return [id.slice(0, -1), true];
    return [id, false];
  }

  function feedsNeeded() {
    const feeds = new Set();
    for (const sec of CONFIG.sections) {
      if (!sec.lines || !sec.lines.length) return Object.keys(FEED_ROUTES);
      for (const line of sec.lines) {
        const f = Object.keys(FEED_ROUTES).find(k => FEED_ROUTES[k].includes(line));
        if (f) feeds.add(f);
      }
    }
    return [...feeds];
  }

  // ---- Minimal protobuf reader: just the GTFS-realtime fields we use ----
  function readVarint(buf, pos) {
    let result = 0, mul = 1, b;
    do { b = buf[pos++]; result += (b & 0x7f) * mul; mul *= 128; } while (b & 0x80);
    return [result, pos];
  }
  // Calls fn(fieldNumber, value) for each field; length-delimited values are [start, end].
  function eachField(buf, start, end, fn) {
    let pos = start;
    while (pos < end) {
      let key, v;
      [key, pos] = readVarint(buf, pos);
      const no = Math.floor(key / 8), wt = key % 8;
      if (wt === 0) { [v, pos] = readVarint(buf, pos); fn(no, v); }
      else if (wt === 2) { [v, pos] = readVarint(buf, pos); fn(no, [pos, pos + v]); pos += v; }
      else if (wt === 1) pos += 8;
      else if (wt === 5) pos += 4;
      else throw new Error("unexpected protobuf wire type " + wt);
    }
  }
  const utf8 = new TextDecoder();

  function decodeFeed(buf) {
    const str = r => utf8.decode(buf.subarray(r[0], r[1]));
    const trip = r => {
      const t = {};
      eachField(buf, r[0], r[1], (n, v) => { if (n === 1) t.tripId = str(v); else if (n === 5) t.routeId = str(v); });
      return t;
    };
    const eventTime = r => { let t = 0; eachField(buf, r[0], r[1], (n, v) => { if (n === 2) t = v; }); return t; };
    const tripUpdates = [], delayed = new Set();
    eachField(buf, 0, buf.length, (n, ent) => {
      if (n !== 2) return;  // FeedMessage.entity
      eachField(buf, ent[0], ent[1], (en, ev) => {
        if (en === 3) {  // trip_update
          const tu = { trip: {}, stus: [] };
          eachField(buf, ev[0], ev[1], (tn, tv) => {
            if (tn === 1) tu.trip = trip(tv);
            else if (tn === 2) {
              const s = { stopId: "", arrival: 0, departure: 0 };
              eachField(buf, tv[0], tv[1], (sn, sv) => {
                if (sn === 2) s.arrival = eventTime(sv);
                else if (sn === 3) s.departure = eventTime(sv);
                else if (sn === 4) s.stopId = str(sv);
              });
              tu.stus.push(s);
            }
          });
          tripUpdates.push(tu);
        } else if (en === 5) {  // alert: the trip feeds flag delayed trips this way
          let text = "";
          const trips = [];
          eachField(buf, ev[0], ev[1], (an, av) => {
            if (an === 5) eachField(buf, av[0], av[1], (sn, sv) => { if (sn === 4) trips.push(trip(sv).tripId); });
            else if (an === 10) eachField(buf, av[0], av[1], (_, tr) =>
              eachField(buf, tr[0], tr[1], (xn, xv) => { if (xn === 1 && !text) text = str(xv); }));
          });
          if (/delay/i.test(text)) trips.forEach(t => t && delayed.add(t));
        }
      });
    });
    return { tripUpdates, delayed };
  }

  function stopMatches(stopId, wanted) {
    return wanted.includes(stopId) || wanted.includes(stopId.slice(0, -1));
  }

  function parseFeed(buf, now) {
    const { tripUpdates, delayed } = decodeFeed(buf);
    const out = CONFIG.sections.map(() => []);
    for (const tu of tripUpdates) {
      const stus = tu.stus;
      if (!stus.length || !tu.trip.routeId) continue;
      const routeId = tu.trip.routeId;
      const [route, express] = displayRoute(routeId);
      const last = stus[stus.length - 1].stopId;
      const dest = STOPS[last] || STOPS[last.slice(0, -1)] || last;
      stus.forEach((stu, idx) => {
        if (idx === stus.length - 1) return;  // train terminates here
        CONFIG.sections.forEach((sec, si) => {
          if (!stopMatches(stu.stopId, sec.stopIds)) return;
          if (sec.lines.length && !sec.lines.includes(routeId) && !sec.lines.includes(route)) return;
          const t = stu.arrival || stu.departure;
          if (!t || t < now) return;
          out[si].push({ route, express, dest, time: t, tripId: tu.trip.tripId,
                         delayed: delayed.has(tu.trip.tripId) });
        });
      });
    }
    return out;
  }

  function relevantAlerts(json, now) {
    const lines = new Set(), stations = new Set(), directions = new Set();
    for (const sec of CONFIG.sections) {
      sec.lines.forEach(l => lines.add(displayRoute(l)[0]));
      for (const sid of sec.stopIds) {
        if ("NS".includes(sid.slice(-1))) { stations.add(sid.slice(0, -1)); directions.add(sid.slice(-1)); }
        else { stations.add(sid); directions.add("N"); directions.add("S"); }
      }
    }
    const out = [], seen = new Set();
    for (const ent of json.entity || []) {
      const a = ent.alert || {};
      const periods = (a.active_period && a.active_period.length) ? a.active_period : [{}];
      if (!periods.some(p => (p.start || 0) <= now && now <= (p.end || Infinity))) continue;
      const tr = ((a.header_text || {}).translation || []).find(t => t.language === "en");
      const text = ((tr && tr.text) || "").replace(/\s*\[[^\]]* icon\]\s*/g, " ").trim();
      if (!text || seen.has(text)) continue;
      const type = (a["transit_realtime.mercury_alert"] || {}).alert_type || "Alert";
      const planned = type.startsWith("Planned");

      const ies = a.informed_entity || [];
      const routes = new Set(ies.filter(i => i.route_id).map(i => displayRoute(i.route_id)[0]));
      const stops = ies.filter(i => i.stop_id).map(i => i.stop_id);
      const myRoutes = [...routes].filter(r => !lines.size || lines.has(r));
      const atStation = stops.some(s => stations.has(s) || stations.has(s.slice(0, -1)));

      if (atStation && (myRoutes.length || !routes.size)) { /* touches our station on our lines */ }
      else if (myRoutes.length && !stops.length && !planned) { /* line-wide real-time problem */ }
      else continue;

      // Drop alerts that only mention the direction we don't show.
      const low = text.toLowerCase();
      const mentions = Object.keys(DIRECTION_WORDS).filter(d => DIRECTION_WORDS[d].some(w => low.includes(w)));
      if (mentions.length && !mentions.some(d => directions.has(d)) && !low.includes("both directions")) continue;

      seen.add(text);
      out.push({ type, planned, text, routes: myRoutes.sort() });
    }
    return out.sort((x, y) => x.planned - y.planned);  // real-time problems first
  }

  // ---- Fetching straight from the MTA (its feeds allow browser access) ----
  const FEEDS = feedsNeeded();
  const results = {};   // feed -> per-section arrivals
  const feedOkAt = {};  // feed -> epoch seconds of last good fetch
  let alerts = [];

  async function get(url) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(url, { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r;
    } finally { clearTimeout(timer); }
  }

  async function poll() {
    await Promise.all(FEEDS.map(async feed => {
      try {
        const buf = new Uint8Array(await (await get(FEED_BASE + feed)).arrayBuffer());
        results[feed] = parseFeed(buf, Date.now() / 1000);
        feedOkAt[feed] = Date.now() / 1000;
      } catch (e) { console.warn("feed", feed, e); }  // keep the last good data
    }));
    if (CONFIG.showAlerts) {
      try { alerts = relevantAlerts(await (await get(ALERTS_URL)).json(), Date.now() / 1000); }
      catch (e) { console.warn("alerts", e); }
    }
    render();
  }

  // Same shape the laptop server's /api/arrivals returns, so the drawing code is shared.
  let data = null;
  function buildData() {
    const now = Date.now() / 1000;
    const okTimes = FEEDS.map(f => feedOkAt[f]);
    data = {
      station_name: CONFIG.stationName,
      // Age of the stalest feed, so one dead feed still triggers the warning.
      last_update: okTimes.every(Boolean) ? Math.min(...okTimes) : null,
      alerts,
      sections: CONFIG.sections.map((sec, i) => ({
        label: sec.label, rows: sec.rows, lines: sec.lines.map(l => displayRoute(l)[0]),
        arrivals: Object.values(results).flatMap(r => r[i] || [])
          .filter(a => a.time >= now).sort((x, y) => x.time - y.time),
      })),
    };
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function colorize(e, route) {
    e.style.background = COLORS[route] || "#808183";
    e.style.color = DARK_TEXT.has(route) ? "#000" : "#fff";
  }

  // Alert text uses [A], [1] etc. for lines; draw those as small bullets.
  function alertText(text) {
    const frag = document.createDocumentFragment();
    text.split(/(\[[A-Z0-9]{1,3}\])/).forEach(part => {
      const m = part.match(/^\[([A-Z0-9]{1,3})\]$/);
      if (m) {
        const route = m[1] === "SIR" ? "SIR" : m[1].replace(/^(GS|FS|H)$/, "S");
        const b = el("span", "mini", route);
        colorize(b, route);
        frag.appendChild(b);
      } else if (part) {
        frag.appendChild(document.createTextNode(part));
      }
    });
    return frag;
  }

  let alertIdx = 0;
  function renderAlert() {
    const bar = document.getElementById("alert");
    const alerts = (data && data.alerts) || [];
    if (!alerts.length) { bar.classList.remove("show"); return; }
    const a = alerts[alertIdx % alerts.length];
    const pill = document.getElementById("alert-pill");
    pill.className = "pill " + (a.planned ? "planned" : "live");
    pill.textContent = a.type.replace(/^Planned - /, "Planned: ");
    document.getElementById("alert-text").replaceChildren(alertText(a.text));
    document.getElementById("alert-count").textContent =
      alerts.length > 1 ? `${(alertIdx % alerts.length) + 1}/${alerts.length}` : "";
    bar.classList.add("show");
  }

  function bullet(a) {
    const b = el("div", "bullet" + (a.express ? " express" : "") + (a.route.length > 1 ? " long" : ""), a.route);
    colorize(b, a.route);
    return b;
  }

  function render() {
    buildData();
    const now = Date.now() / 1000;
    renderAlert();
    const root = document.getElementById("sections");
    root.replaceChildren();
    if (!data) return;
    document.getElementById("station").textContent = data.station_name;

    for (const sec of data.sections) {
      const s = el("div", "section");
      s.appendChild(el("div", "label", sec.label));
      const trains = sec.arrivals.filter(a => a.time >= now).slice(0, sec.rows);
      for (let i = 0; i < sec.rows; i++) {
        const row = el("div", "row");
        const a = trains[i];
        if (a) {
          row.appendChild(el("div", "rank", String(i + 1)));
          row.appendChild(bullet(a));
          row.appendChild(el("div", "dest", a.dest));
          if (a.delayed) row.appendChild(el("div", "delayed", "Delayed"));
          const m = el("div", "mins", String(Math.floor((a.time - now) / 60)));
          m.appendChild(el("small", null, "min"));
          row.appendChild(m);
        } else if (i === 0 && data.last_update) {
          const noticed = (data.alerts || []).some(n => n.routes.some(r => (sec.lines || []).includes(r)));
          row.appendChild(el("div", "empty", noticed ? "No trains stopping here — see notice above" : "No trains scheduled"));
        }
        s.appendChild(row);
      }
      root.appendChild(s);
    }

    const foot = document.getElementById("foot");
    const age = data.last_update ? Math.round(now - data.last_update) : null;
    if (!navigator.onLine) {
      foot.className = "foot warn";
      foot.textContent = "No internet connection — times may be wrong";
    } else if (age === null || age > STALE_SECONDS) {
      foot.className = "foot warn";
      foot.textContent = age === null
        ? "Waiting for live data from the MTA…"
        : `No fresh MTA data for ${Math.floor(age / 60)} min — times may be stale`;
    } else {
      foot.className = "foot";
      foot.textContent = `updated ${age}s ago`;
    }
  }

  function tickClock() {
    // Always New York time, whatever time zone the device is set to.
    const clock = document.getElementById("clock");
    clock.textContent = new Date().toLocaleTimeString("en-US",
      { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
    clock.appendChild(el("small", "tz", "ET"));
  }

  // Keep the display awake while the clock is open (where the browser supports it).
  async function keepAwake() {
    try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
  keepAwake();

  // Hide the cursor after 3 s without mouse movement.
  let idleTimer;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
  }
  document.addEventListener("mousemove", wake);
  wake();

  // Tap/click anywhere to go full screen (phones and TV browsers).
  document.addEventListener("click", () => {
    const d = document.documentElement;
    if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {});
  });

  tickClock();
  poll();
  setInterval(tickClock, 1000);
  setInterval(() => { alertIdx++; renderAlert(); }, 12000);  // rotate notices
  setInterval(render, 5000);                       // recompute minutes
  setInterval(poll, CONFIG.refreshSeconds * 1000);  // refetch from the MTA
  setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
